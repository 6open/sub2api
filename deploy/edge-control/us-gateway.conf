map $http_upgrade $lklb_us_connection {
    default upgrade;
    '' '';
}
server {
    listen 9443 ssl;
    listen 127.0.0.1:10444 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name us.lklb.top;
    ssl_certificate /etc/letsencrypt/live/us.lklb.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/us.lklb.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 8m;
    client_body_timeout 20s;
    location = /v1/models {
        proxy_pass http://127.0.0.1:19445;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
    }
    location = /v1/responses {
        proxy_pass http://127.0.0.1:19445;
        proxy_http_version 1.1;
        proxy_set_header Connection $lklb_us_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1230s;
        proxy_send_timeout 30s;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:19445;
        proxy_http_version 1.1;
        proxy_set_header Connection $lklb_us_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1230s;
        proxy_send_timeout 30s;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
    location / { return 404; }
}
